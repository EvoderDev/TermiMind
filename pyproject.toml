[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termimind"
version = "1.0.0"
description = "AI-powered, sandbox-protected terminal command fixer with Bash, Zsh, and PowerShell hooks."
readme = "README.md"
authors = [
    { name = "EvoderDev" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = [
    "terminal",
    "cli",
    "command-fixer",
    "llm",
    "bash",
    "zsh",
    "powershell",
    "developer-tools",
    "productivity",
    "sandbox"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
    "Topic :: Utilities"
]
dependencies = [
    "rich>=13.0.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "coverage>=7.0.0"
]

[project.scripts]
termimind = "termimind.cli:main"
tm = "termimind.cli:main"

[project.urls]
Homepage = "https://github.com/EvoderDev/TermiMind"
Repository = "https://github.com/EvoderDev/TermiMind"
Issues = "https://github.com/EvoderDev/TermiMind/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["termimind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
